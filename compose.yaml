
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: timemirror-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - timemirror-sql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  timemirror-sql-data:
    name: timemirror-sql-data
